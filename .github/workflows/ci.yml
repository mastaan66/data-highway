name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff
      - run: ruff check Code/ || true
      - run: python -m py_compile Code/Analysis/analysis.py Code/Dataset\ Generation/queries.py Code/Dataset\ Generation/indexes.py Code/Dataset\ Generation/configurations.py
